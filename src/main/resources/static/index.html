

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Amount QR Tracker</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #123b70;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 4px 15px #00000015;
        }

        input {
            width: 90%;
            padding: 13px;
            margin: 15px 0;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            padding: 14px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        #qrResult {
            margin-top: 25px;
        }

        footer {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Fixed Amount QR Tracker</h1>
    <p>Generate and Track QR Codes</p>
</header>

<div class="container">
    <h2>Generate QR Code</h2>

    <label for="amount">Enter Fixed Amount (₹)</label><br>

    <input type="number" id="amount"
           placeholder="Enter amount" min="0.01" step="0.01">

    <br>

    <button onclick="generateQR()">Generate QR Code</button>
    <button onclick="downloadQR()">Download QR Code</button>i d
    <button onclick="clearQR()">Clear</button>

    <div id="qrResult"></div>
</div>

<footer>
    Fixed Amount QR Tracker | 2026
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
    async function generateQR() {
    const amount = document.getElementById("amount").value;
    const result = document.getElementById("qrResult");

    if (!amount || !Number.isFinite(Number(amount)) || Number(amount) <= 0) {
        alert("Please enter a valid amount.");
        return;
    }

    if (typeof QRCode === "undefined") {
        alert("QR library could not load. Check your internet connection.");
        return;
    }

    try {
        const response = await fetch(
            `/api/verify-amount?amount=${encodeURIComponent(amount)}`
        );

        const message = await response.text();

        if (!response.ok || !message.startsWith("Amount verified successfully:")) {
            alert(message);
            return;
        }

        result.innerHTML = `
            <h3>QR Code Generated Successfully!</h3>
            <p>Amount to be paid: ₹${Number(amount).toFixed(2)}</p>
            <p>Scan this QR code to view the amount.</p>
            <div id="qrcode" style="display:flex; justify-content:center; margin:20px;"></div>
        `;

        new QRCode(document.getElementById("qrcode"), {
            text: Number(amount).toFixed(2),
            width: 200,
            height: 200,
            correctLevel: QRCode.CorrectLevel.H
        });

    } catch (error) {
        alert("Unable to connect to the backend. Please try again.");
        console.error(error);
    }
}

function downloadQR() {
    const qrImage = document.querySelector("#qrcode img");

    if (!qrImage) {
        alert("Please generate a QR code first!");
        return;
    }

    const link = document.createElement("a");
    link.href = qrImage.src;
    link.download = "FixedAmount_QR_Code.png";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
function clearQR() {
    document.getElementById("amount").value = "";
    document.getElementById("qrResult").innerHTML = "";
}

</script>

</body>
</html>
